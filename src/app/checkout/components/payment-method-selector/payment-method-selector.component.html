<fieldset class="space-y-3">
  <legend class="mb-3 text-base font-bold text-nexo-text">{{ copy.payment.selectMethod }}</legend>
  <div class="grid gap-2.5 sm:grid-cols-3">
    @for (option of options; track option.value) {
      <label
        class="group flex min-h-18 cursor-pointer items-center gap-2.5 rounded-lg border px-3.5 py-3 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-nexo-primary/40 focus-within:ring-2 focus-within:ring-nexo-primary/25 hover:border-nexo-primary-outline"
        role="radio"
        tabindex="0"
        [attr.aria-checked]="selected() === option.value"
        (keydown)="handleKeydown($event, option.value)"
        [class.border-nexo-primary-strong]="selected() === option.value"
        [class.bg-nexo-primary-pale]="selected() === option.value"
        [class.shadow-nexo-selected]="selected() === option.value"
        [class.border-nexo-border-soft]="selected() !== option.value"
      >
        <input
          class="sr-only"
          type="radio"
          name="payment-method"
          [value]="option.value"
          [checked]="selected() === option.value"
          tabindex="-1"
          (change)="methodSelected.emit(option.value)"
        />
        <span
          class="grid h-7 w-7 shrink-0 place-items-center rounded-md"
          [class.bg-nexo-primary-icon]="selected() === option.value"
          [class.bg-nexo-field-muted]="selected() !== option.value"
          [class.text-nexo-primary]="selected() === option.value"
          [class.text-nexo-icon-soft]="selected() !== option.value"
        >
          @if (option.value === 'pix') {
            <img class="h-4 w-5 object-contain" src="/pix-logo.svg" alt="" aria-hidden="true" />
          } @else {
            <ng-icon name="phosphorCreditCardBold" size="16" class="h-4 w-4" aria-hidden="true" />
          }
        </span>
        <span class="min-w-0"
          ><span
            class="block text-sm font-semibold"
            [class.text-nexo-primary]="selected() === option.value"
            [class.text-nexo-body]="selected() !== option.value"
            >{{ option.label }}</span
          ><span class="mt-0.5 block truncate text-xs text-nexo-option-muted">{{
            option.description
          }}</span></span
        >
        <span
          class="ml-auto h-3 w-3 shrink-0 rounded-full border-2"
          [class.border-nexo-primary]="selected() === option.value"
          [class.bg-nexo-primary]="selected() === option.value"
          [class.border-nexo-border-muted]="selected() !== option.value"
        ></span>
      </label>
    }
  </div>
</fieldset>
